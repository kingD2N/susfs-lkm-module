# SPDX-License-Identifier: GPL-2.0-only
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile tools/build.py tools/sync.py tests/test_loader.py tests/test_probe.py tests/test_build.py
      - name: Host tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Build module ZIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: susfs-lkm-module
          path: dist/*.zip
